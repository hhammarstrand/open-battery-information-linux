name: Package OBI Linux for Ubuntu/Pop!_OS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk tk-dev binutils

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r OpenBatteryInformation/requirements.txt

    - name: Build with PyInstaller
      run: |
        cd OpenBatteryInformation
        python -m PyInstaller obi-linux.spec

    - name: Package binary with desktop integration
      run: |
        cd OpenBatteryInformation
        STAGE_NAME=obi-linux-pkg
        STAGE="dist/$STAGE_NAME"
        mkdir -p "$STAGE"
        cp dist/obi-linux "$STAGE/obi-linux"
        cp icon.png "$STAGE/"
        cp ../linux/obi-linux.desktop "$STAGE/"
        cp ../linux/90-arduino-obi.rules "$STAGE/"
        cp ../linux/install.sh "$STAGE/"
        chmod +x "$STAGE/install.sh" "$STAGE/obi-linux"
        tar -C dist -czf dist/obi-linux-x86_64.tar.gz "$STAGE_NAME"

    - name: Upload Application
      uses: actions/upload-artifact@v4
      with:
        name: obi-linux-x86_64
        path: OpenBatteryInformation/dist/obi-linux-x86_64.tar.gz

    - name: Upload Compiled File to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: OpenBatteryInformation/dist/obi-linux-x86_64.tar.gz
